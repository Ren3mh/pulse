# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stand-in for the retailer's Dynamics AX 2009 database (SQL Server).
  ax:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Pulse_local_1! # local development only
    ports:
      - "1433:1433"
    volumes:
      - ax-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Pulse_local_1!' -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the AX tables once SQL Server is up, then exits.
  ax-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      ax:
        condition: service_healthy
    volumes:
      - ./ax:/ax:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "ax", "-U", "sa", "-P", "Pulse_local_1!", "-b", "-i", "/ax/schema.sql"]
    restart: "no"

  # Pulse itself: syncs AX and Shopify into Postgres every 15 minutes.
  # Shopify credentials come from .env (see README); without them only AX syncs.
  api:
    build:
      context: .
      dockerfile: src/Pulse.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      ax-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=pulse;Username=pulse;Password=pulse
      Ax__ConnectionString: Server=ax,1433;Database=DynamicsAx;User Id=sa;Password=Pulse_local_1!;TrustServerCertificate=true
    ports:
      - "5099:8080"
    healthcheck:
      # The runtime image has no curl, so ask /health over bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  ax-data:
