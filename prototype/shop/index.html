<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nordlys Design (pulse test shop)</title>
  <style>
    :root {
      --bg: #f6f3ee; --surface: #ffffff; --text: #22201c; --muted: #6f6a62;
      --line: #e4ded4; --accent: #2f4a3a; --accent-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 20px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 20px; letter-spacing: .04em; font-weight: 600; }
    header small { color: var(--muted); }
    form { margin-left: auto; display: flex; gap: 8px; }
    input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; min-width: 0; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-text); font: inherit; cursor: pointer; }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; align-content: start; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0; text-align: left; color: inherit; overflow: hidden; }
    .swatch { height: 110px; }
    .card div.body { padding: 10px 12px; }
    .card strong { display: block; }
    .card span { color: var(--muted); font-size: 13px; }
    aside { display: flex; flex-direction: column; gap: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    #log { list-style: none; margin: 0; padding: 0; font: 12px/1.4 ui-monospace, monospace; max-height: 320px; overflow: auto; }
    #log li { padding: 4px 0; border-bottom: 1px solid var(--line); }
    .empty { color: var(--muted); }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } form { margin-left: 0; width: 100%; } form input { flex: 1; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>NORDLYS DESIGN</h1>
      <small>Fictional test shop for pulse. Every click sends an event.</small>
    </div>
    <form id="search">
      <input id="q" type="search" placeholder="Search chairs, lamps, designers…" aria-label="Search">
      <button>Search</button>
    </form>
  </header>

  <main>
    <section class="grid" id="products"></section>
    <aside>
      <div class="panel" id="detail"><h2>Product</h2><p class="empty">Pick a product.</p></div>
      <div class="panel"><h2>Events sent</h2><ul id="log"><li class="empty">None yet.</li></ul></div>
    </aside>
  </main>

  <script type="module">
    import { track } from "./track.js";

    const colors = { chairs: "#c9b79c", sofas: "#9fae9a", lighting: "#e8d49a", tables: "#8a7a66", accessories: "#b9c4cc" };
    const grid = document.getElementById("products");
    const detail = document.getElementById("detail");
    const log = document.getElementById("log");
    const kr = (n) => n.toLocaleString("da-DK") + " kr.";
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    async function load(query = "") {
      const url = query ? `/products?q=${encodeURIComponent(query)}` : "/products";
      const products = await (await fetch(url)).json();
      grid.innerHTML = products.length ? "" : '<p class="empty">No products match.</p>';
      for (const p of products) {
        const card = document.createElement("button");
        card.className = "card";
        card.innerHTML = `<div class="swatch" style="background:${colors[p.category] ?? "#ccc"}"></div>
          <div class="body"><strong>${esc(p.name)}</strong><span>${esc(p.designer)} · ${kr(p.price_dkk)}</span></div>`;
        card.onclick = () => show(p);
        grid.append(card);
      }
      return products;
    }

    function show(p) {
      const size = p.width_cm ? `${p.width_cm} × ${p.depth_cm ?? "?"} × ${p.height_cm ?? "?"} cm` : "Dimensions missing";
      detail.innerHTML = `<h2>Product</h2><strong>${esc(p.name)}</strong>
        <p>${esc(p.description_da) || '<span class="empty">No description yet.</span>'}</p>
        <p class="empty">${esc(p.materials.join(", "))} · ${size}</p>
        <button id="add">Add to cart · ${kr(p.price_dkk)}</button>`;
      document.getElementById("add").onclick = () =>
        track("cart_item_added", { product_id: p.product_id, price_dkk: p.price_dkk });
      track("product_viewed", { product_id: p.product_id, category: p.category });
    }

    document.getElementById("search").onsubmit = async (e) => {
      e.preventDefault();
      const query = document.getElementById("q").value.trim();
      const results = await load(query);
      track("search_submitted", { query, results_count: results.length });
    };

    window.addEventListener("pulse:tracked", ({ detail: ev }) => {
      log.querySelector(".empty")?.remove();
      const li = document.createElement("li");
      li.textContent = `${ev.occurred_at.slice(11, 19)}  ${ev.event_name}  ${JSON.stringify(ev.properties)}`;
      log.prepend(li);
    });

    await load();
    track("page_viewed", { page: "/shop/" });
  </script>
</body>
</html>
