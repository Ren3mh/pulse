version: 2

models:
  - name: stg_events
    description: Version 1 events with typed columns. Contains visitor ids, so agents never read it.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_name
        data_tests:
          - accepted_values:
              arguments:
                values: [page_viewed, product_viewed, search_submitted, cart_item_added]
      - name: event_date
        description: Date in Europe/Copenhagen.
        data_tests: [not_null]
      - name: product_id
        description: Set on product_viewed and cart_item_added.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_products
    description: The product catalogue, unchanged.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
